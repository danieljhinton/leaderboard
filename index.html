<title>Halo Booth Scoreboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* Halo brand palette (Brand Book v1.0) */
    --halo-blue:#00CEFF; --teal:#81E4F8; --navy:#002D5B; --midnight:#051830;
    --sky:#E5F7FC; --peach:#FFD69A; --lime:#F1FFD1; --lilac:#BED4FF;

    --bg:#F3FAFC; --surface:#FFFFFF; --surface-tint:#E5F7FC; --border:#D3E7EE;
    --text:#002D5B; --text-muted:#5C7C8C;
    --accent:#00CEFF; --accent-ink:#002D5B; --accent-soft:#E0FAFF;
    --accent-2:#81E4F8; --accent-2-ink:#002D5B; --accent-2-soft:#EAFBFE;
    --danger:#C1432E; --danger-soft:#FBE7E2; --success:#1F8F5A;
    --radius-card:28px; --radius-md:16px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(0,45,91,.06), 0 12px 28px -16px rgba(0,45,91,.22);
    --font:'Poppins',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#051830; --surface:#0A2540; --surface-tint:#0F3050; --border:#1C3E5C;
      --text:#F3FAFC; --text-muted:#84AABE;
      --accent:#00CEFF; --accent-ink:#051830; --accent-soft:#0F3A52;
      --accent-2:#81E4F8; --accent-2-ink:#051830; --accent-2-soft:#0F3A52;
      --danger:#FF7A63; --danger-soft:#3A241E; --success:#4FD38A;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#051830; --surface:#0A2540; --surface-tint:#0F3050; --border:#1C3E5C;
    --text:#F3FAFC; --text-muted:#84AABE;
    --accent:#00CEFF; --accent-ink:#051830; --accent-soft:#0F3A52;
    --accent-2:#81E4F8; --accent-2-ink:#051830; --accent-2-soft:#0F3A52;
    --danger:#FF7A63; --danger-soft:#3A241E; --success:#4FD38A;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:var(--font); font-weight:700; letter-spacing:-.01em; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  #app{ min-height:100vh; }

  /* ---------- shared controls ---------- */
  .btn{
    appearance:none; border:0; border-radius:999px; cursor:pointer;
    font-weight:600; font-size:16px; padding:15px 24px; min-height:52px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .btn[disabled]{ opacity:.55; cursor:not-allowed; }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover:not([disabled]){ filter:brightness(1.12); }
  :root:not([data-theme="light"]) .btn-primary, :root[data-theme="dark"] .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:var(--accent-soft); color:var(--navy); border:1.5px solid var(--accent); }
  :root:not([data-theme="light"]) .btn-secondary, :root[data-theme="dark"] .btn-secondary{ color:var(--text); }
  .btn-secondary:hover:not([disabled]){ filter:brightness(1.04); }
  .btn-ghost{ background:transparent; color:var(--text-muted); font-weight:500; min-height:auto; padding:8px 10px; border-radius:8px; }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); border:1.5px solid var(--danger); }
  .btn-danger:hover:not([disabled]){ filter:brightness(1.04); }
  .btn-block{ width:100%; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:13px; font-weight:600; color:var(--text-muted); }
  .field input{
    border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:13px 16px;
    font-size:16px; background:var(--surface); color:var(--text);
  }
  .field input:focus-visible{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow); padding:26px;
  }

  .notice{ border-radius:var(--radius-sm); padding:12px 16px; font-size:14px; line-height:1.45; }
  .notice-danger{ background:var(--danger-soft); color:var(--danger); }
  .notice-muted{ background:var(--surface-tint); color:var(--text-muted); }

  .device-switch{
    position:fixed; left:14px; bottom:14px; z-index:5;
    font-size:12px; color:var(--text-muted); background:var(--surface);
    border:1px solid var(--border); border-radius:999px; padding:7px 14px;
    box-shadow:var(--shadow); cursor:pointer; opacity:.75;
  }
  .device-switch:hover{ opacity:1; }

  .settings-fab, .fullscreen-fab{
    position:fixed; right:14px; bottom:14px; z-index:5; width:40px; height:40px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border);
    color:var(--text-muted); box-shadow:var(--shadow); cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:.75;
  }
  .settings-fab:hover, .fullscreen-fab:hover{ opacity:1; }
  .settings-fab svg, .fullscreen-fab svg{ width:18px; height:18px; }
  .fullscreen-fab{ bottom:62px; }
  .fullscreen-note{
    position:fixed; right:14px; bottom:108px; z-index:5; max-width:240px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    box-shadow:var(--shadow); padding:12px 14px; font-size:12px; color:var(--text-muted);
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,20,38,.6); z-index:20;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{ width:100%; max-width:400px; }
  .modal h2{ font-size:22px; margin-bottom:4px; }

  /* ---------- avatar (squircle) ---------- */
  .avatar{
    flex:none; display:flex; align-items:center; justify-content:center;
    border-radius:32%; font-weight:700; font-family:var(--font);
    letter-spacing:0;
  }

  /* ---------- mode select ---------- */
  .mode-select{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:32px 20px;
  }
  .mode-select .eyebrow{
    text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:600; color:var(--text-muted);
  }
  .mode-tiles{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; max-width:720px; }
  .mode-tile{
    flex:1 1 260px; max-width:320px; text-align:left; cursor:pointer;
    background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow); padding:26px; display:flex; flex-direction:column; gap:10px;
  }
  .mode-tile:hover{ border-color:var(--accent); }
  .mode-tile:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .mode-tile .tile-kicker{ font-family:var(--font); font-size:12px; color:var(--navy); font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  :root:not([data-theme="light"]) .mode-tile .tile-kicker, :root[data-theme="dark"] .mode-tile .tile-kicker{ color:var(--accent); }
  .mode-tile h3{ font-size:22px; }
  .mode-tile p{ color:var(--text-muted); font-size:14px; line-height:1.5; }

  /* ---------- kiosk ---------- */
  .kiosk-screen{ min-height:100vh; display:flex; flex-direction:column; }
  .kiosk-wrap{
    max-width:440px; margin:0 auto; width:100%; flex:1;
    padding:28px 20px 60px; display:flex; flex-direction:column; gap:20px;
  }
  .kiosk-brand{ display:flex; flex-direction:column; gap:8px; }
  .kiosk-brand .title{ font-size:25px; font-weight:700; }
  .kiosk-brand .subtitle{ font-size:13px; color:var(--text-muted); }

  .steps{ display:flex; gap:6px; align-items:center; }
  .steps .step{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .steps .bar{ height:4px; border-radius:2px; background:var(--border); }
  .steps .step.active .bar, .steps .step.done .bar{ background:var(--accent); }
  .steps .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); font-weight:600; }
  .steps .step.active .label{ color:var(--navy); }
  :root:not([data-theme="light"]) .steps .step.active .label, :root[data-theme="dark"] .steps .step.active .label{ color:var(--accent); }

  .choice-list{ display:flex; flex-direction:column; gap:12px; }
  .choice-btn{
    text-align:left; cursor:pointer; background:var(--surface); border:1.5px solid var(--border);
    border-radius:var(--radius-card); box-shadow:var(--shadow); padding:22px; display:flex; flex-direction:column; gap:4px;
  }
  .choice-btn:hover{ border-color:var(--accent); }
  .choice-btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .choice-btn h3{ font-size:20px; }
  .choice-btn p{ color:var(--text-muted); font-size:13px; }

  form{ display:flex; flex-direction:column; gap:14px; }

  .search-box{ position:relative; }
  #existing-list{ display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; padding-right:2px; }
  .player-row{
    text-align:left; cursor:pointer; width:100%; background:var(--surface-tint); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:10px 14px; display:flex; align-items:center; gap:12px;
  }
  .player-row:hover{ border-color:var(--accent); }
  .player-row .avatar{ width:36px; height:36px; font-size:14px; }
  .player-row .meta-col{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .player-row .name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .player-row .company{ font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty-hint{ font-size:13px; color:var(--text-muted); text-align:center; padding:20px 10px; }

  .player-context{ display:flex; align-items:center; gap:14px; padding-bottom:16px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .player-context .avatar{ width:52px; height:52px; font-size:19px; }
  .player-context .name{ font-size:20px; font-weight:700; }
  .player-context .meta{ font-size:13px; color:var(--text-muted); }

  .current-best{ display:flex; align-items:center; gap:12px; }
  .stat-pill{
    background:var(--navy); color:#fff; border-radius:999px; padding:10px 20px;
    display:flex; align-items:baseline; gap:4px; font-weight:700;
  }
  .stat-pill .num{ font-size:26px; font-variant-numeric:tabular-nums; }
  .stat-pill .suffix{ font-size:12px; opacity:.8; }
  .current-best .lbl{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; }

  .score-input{ text-align:center; font-family:var(--font); font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; padding:16px; }

  .done-banner{ text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; padding:8px 0 4px; }
  .done-banner .kicker{ font-size:13px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.08em; }
  :root:not([data-theme="light"]) .done-banner .kicker, :root[data-theme="dark"] .done-banner .kicker{ color:var(--accent); }
  .done-capsule{
    background:var(--navy); color:var(--halo-blue); border-radius:999px;
    width:150px; height:190px; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
  }
  .done-capsule .num{ font-size:56px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .done-banner .caption{ font-size:14px; color:var(--text-muted); max-width:320px; }
  .done-actions{ display:flex; flex-direction:column; gap:10px; width:100%; }

  /* ---------- leaderboard ---------- */
  .lb{
    background:var(--midnight); color:#F3FAFC; min-height:100vh;
    display:flex; flex-direction:column; padding:clamp(20px,3vw,44px) clamp(20px,4vw,64px) 90px;
    font-family:var(--font);
  }
  .lb-header{
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
    padding-bottom:clamp(16px,2.4vw,28px); border-bottom:1px solid #163656; margin-bottom:clamp(16px,2.4vw,28px);
  }
  .lb-brand{ display:flex; flex-direction:column; gap:10px; }
  .lb-header h1{ font-size:clamp(28px,4.4vw,52px); color:#F3FAFC; }
  .lb-header .subtitle{ font-size:clamp(13px,1.3vw,17px); color:#7FA3B8; margin-top:4px; }
  .lb-status{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .live-pill{
    display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; letter-spacing:.08em;
    color:var(--halo-blue); border:1px solid var(--halo-blue); border-radius:999px; padding:5px 14px;
  }
  .live-dot{ width:7px; height:7px; border-radius:999px; background:var(--halo-blue); animation:pulse 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .live-dot{ animation:none; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .player-count{ font-size:clamp(12px,1.1vw,14px); color:#7FA3B8; }

  .lb-list{ display:flex; flex-direction:column; gap:10px; flex:1; }
  .lb-row{
    display:grid; grid-template-columns:auto auto 1fr auto; align-items:center; gap:clamp(12px,2vw,22px);
    background:#0A2540; border:1px solid #163656; border-radius:var(--radius-card);
    padding:clamp(12px,1.6vw,20px) clamp(16px,2.2vw,26px); border-left:4px solid transparent;
    width:100%; text-align:left; cursor:pointer; font-family:var(--font); appearance:none; margin:0;
    color:#F3FAFC;
  }
  .lb-row:hover{ border-color:var(--halo-blue); }
  .lb-row:focus-visible{ outline:3px solid var(--halo-blue); outline-offset:2px; }
  .lb-row .rank{ font-weight:700; font-variant-numeric:tabular-nums; color:#7FA3B8; font-size:clamp(16px,1.6vw,20px); min-width:2ch; }
  .lb-row .avatar{ width:clamp(34px,3.4vw,46px); height:clamp(34px,3.4vw,46px); font-size:clamp(13px,1.4vw,17px); }
  .lb-row .name{ font-weight:600; font-size:clamp(17px,1.9vw,24px); overflow-wrap:anywhere; }
  .lb-row .score{ font-weight:700; text-align:right; font-variant-numeric:tabular-nums; font-size:clamp(20px,2.4vw,30px); }
  .lb-row.rank-1{ border-left-color:#F2C94C; background:#0F3050; padding-block:clamp(18px,2.4vw,28px); }
  .lb-row.rank-1 .rank{ color:var(--halo-blue); font-size:clamp(22px,2.6vw,30px); display:flex; align-items:center; }
  .lb-row.rank-1 .rank svg{ width:clamp(30px,3.4vw,40px); height:clamp(30px,3.4vw,40px); }
  .lb-row.rank-1 .name{ font-size:clamp(22px,2.8vw,32px); }
  .lb-row.rank-1 .score{ color:var(--halo-blue); font-size:clamp(26px,3.2vw,42px); }
  .lb-row.rank-2{ border-left-color:var(--teal); }
  .lb-row.rank-2 .rank{ color:var(--teal); }
  .lb-row.rank-3{ border-left-color:var(--lilac); }
  .lb-row.rank-3 .rank{ color:var(--lilac); }
  .lb-empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:#7FA3B8; text-align:center; padding:40px 20px;
  }
  .lb-empty h2{ color:#F3FAFC; font-size:clamp(20px,2.4vw,28px); }

  @media (max-width:520px){
    .kiosk-wrap{ padding-left:16px; padding-right:16px; }
    .mode-tiles{ flex-direction:column; align-items:stretch; }
    .lb-row{ grid-template-columns:auto auto 1fr auto; }
  }
</style>

<div id="app"></div>

<script>
(function(){
  "use strict";

  var db = null;
  var configUnsub = null, leaderboardUnsub = null, existingUnsub = null;

  var state = {
    mode: null,
    step: "start",
    selectedPlayer: null,
    dupPlayer: null,
    players: [],
    searchTerm: "",
    config: { title: "Booth Challenge", subtitle: "Play the game. Climb the board." },
    dbAvailable: null,
    formError: "",
    scoreError: "",
    lastResultIsNewBest: false,
    showSettings: false,
    busy: false,
    exportBusy: false,
    exportError: "",
    editingPlayer: null,
    editScoreError: "",
    confirmRemove: false,
    fullscreenBlocked: false
  };

  var app = document.getElementById("app");

  var AVATAR_PALETTE = [
    { bg: "#00CEFF", ink: "#002D5B" },
    { bg: "#002D5B", ink: "#FFFFFF" },
    { bg: "#81E4F8", ink: "#002D5B" },
    { bg: "#BED4FF", ink: "#002D5B" },
    { bg: "#FFD69A", ink: "#002D5B" }
  ];

  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
    });
  }

  function fmtScore(n){
    if(n === null || n === undefined) return "—";
    return Number(n).toLocaleString();
  }

  function hashStr(str){
    var h = 0;
    str = String(str || "");
    for(var i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) >>> 0; }
    return h;
  }

  function avatarHtml(id, name, size){
    var pal = AVATAR_PALETTE[hashStr(id || name) % AVATAR_PALETTE.length];
    var initial = (name || "?").trim().charAt(0).toUpperCase() || "?";
    var s = size || 36;
    return '<span class="avatar" style="width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s * 0.4) + 'px;background:' + pal.bg + ';color:' + pal.ink + ';">' + escapeHtml(initial) + '</span>';
  }

  // ---------------- fullscreen ----------------
  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }
  function toggleFullscreen(){
    if(isFullscreen()){
      var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if(ex) ex.call(document);
      return;
    }
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(!req){ state.fullscreenBlocked = true; render(); return; }
    var result = req.call(el);
    if(result && result.catch){
      result.catch(function(){ state.fullscreenBlocked = true; render(); });
    }
  }
  ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(function(evt){
    document.addEventListener(evt, function(){ state.fullscreenBlocked = false; render(); });
  });

  // ---------------- persistence helpers ----------------
  function saveModePref(m){
    try{ if(m) localStorage.setItem("boothScoreboardMode", m); else localStorage.removeItem("boothScoreboardMode"); }catch(e){}
  }
  function loadModePref(){
    try{ return localStorage.getItem("boothScoreboardMode"); }catch(e){ return null; }
  }

  // ---------------- subscriptions ----------------
  function subscribeConfig(){
    if(!db) return;
    if(configUnsub) configUnsub();
    configUnsub = db.doc("config/event").onSnapshot(function(snap){
      if(snap.exists){
        var d = snap.data();
        state.config = { title: (d.title || "Booth Challenge"), subtitle: (d.subtitle || "Play the game. Climb the board.") };
      }
      render();
    }, function(){ /* keep defaults */ });
  }

  function subscribeLeaderboard(){
    if(!db) return;
    if(leaderboardUnsub) leaderboardUnsub();
    leaderboardUnsub = db.collection("players")
      .where("bestScore", ">=", 0)
      .orderBy("bestScore", "desc")
      .limit(50)
      .onSnapshot(function(snap){
        state.players = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
        render();
      }, function(){ render(); });
  }

  function subscribeExisting(){
    if(!db) return;
    if(existingUnsub) existingUnsub();
    existingUnsub = db.collection("players")
      .orderBy("name")
      .limit(300)
      .onSnapshot(function(snap){
        state.players = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
        renderExistingListOnly();
      }, function(){ renderExistingListOnly(); });
  }

  function teardownExisting(){ if(existingUnsub){ existingUnsub(); existingUnsub = null; } }
  function teardownLeaderboard(){ if(leaderboardUnsub){ leaderboardUnsub(); leaderboardUnsub = null; } }

  // ---------------- mode / step transitions ----------------
  function setMode(m){
    teardownLeaderboard();
    teardownExisting();
    state.mode = m;
    state.step = "start";
    state.selectedPlayer = null;
    state.players = [];
    state.searchTerm = "";
    state.formError = "";
    state.scoreError = "";
    saveModePref(m);
    if(m === "leaderboard" && db) subscribeLeaderboard();
    render();
  }

  function goStep(step){
    if(state.step === "existing" && step !== "existing") teardownExisting();
    state.step = step;
    state.formError = "";
    state.scoreError = "";
    state.dupPlayer = null;
    if(step === "start"){ state.selectedPlayer = null; state.searchTerm = ""; }
    if(step === "existing" && db) subscribeExisting();
    render();
  }

  // ---------------- writes ----------------
  function createPlayer(name, company, email){
    if(!db){ state.formError = "Not connected — check your connection and try again."; render(); return; }
    name = name.trim(); company = company.trim(); email = email.trim();
    if(!name || !company || !email){ state.formError = "Please fill in every field."; render(); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.formError = "That email address doesn’t look right."; render(); return; }
    var emailLower = email.toLowerCase();
    state.busy = true; state.formError = ""; render();
    db.collection("players").where("emailLower", "==", emailLower).limit(1).get()
      .then(function(snap){
        if(!snap.empty){
          var existing = snap.docs[0];
          state.dupPlayer = Object.assign({ id: existing.id }, existing.data());
          state.formError = "DUP";
          state.busy = false; render();
          return null;
        }
        var data = {
          name: name, company: company, email: email, emailLower: emailLower,
          bestScore: null, lastScore: null,
          createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
        };
        return db.collection("players").add(data).then(function(ref){
          state.selectedPlayer = Object.assign({ id: ref.id }, data);
          state.step = "score";
          state.formError = "";
          state.busy = false; render();
        });
      })
      .catch(function(){
        state.formError = "Something went wrong saving your details — try again.";
        state.busy = false; render();
      });
  }

  function submitScore(rawValue){
    if(!db){ state.scoreError = "Not connected — check your connection and try again."; render(); return; }
    var n = Number(rawValue);
    if(!Number.isFinite(n) || n < 0 || !Number.isInteger(n)){
      state.scoreError = "Enter a whole number, 0 or higher.";
      render(); return;
    }
    var player = state.selectedPlayer;
    var prevBest = player.bestScore;
    var newBest = (prevBest === null || prevBest === undefined || n > prevBest) ? n : prevBest;
    state.busy = true; state.scoreError = ""; render();
    db.doc("players/" + player.id).update({
      bestScore: newBest, lastScore: n, updatedAt: new Date().toISOString()
    }).then(function(){
      state.selectedPlayer = Object.assign({}, player, { bestScore: newBest, lastScore: n });
      state.lastResultIsNewBest = (prevBest === null || prevBest === undefined || n > prevBest);
      state.step = "done";
      state.busy = false; render();
    }).catch(function(){
      state.scoreError = "Could not save your score — try again.";
      state.busy = false; render();
    });
  }

  function csvField(v){
    var s = (v === null || v === undefined) ? "" : String(v);
    if(/[",\n\r]/.test(s)){ s = '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }

  function exportPlayersCsv(){
    if(!db){ state.exportError = "Not connected — check your connection and try again."; render(); return; }
    state.exportBusy = true; state.exportError = ""; render();
    db.collection("players").orderBy("name").limit(1000).get()
      .then(function(snap){
        var rows = [["Name", "Company", "Email", "Best Score", "Last Score", "Registered At", "Updated At"]];
        snap.docs.forEach(function(d){
          var p = d.data();
          rows.push([
            p.name || "", p.company || "", p.email || "",
            (p.bestScore === null || p.bestScore === undefined) ? "" : p.bestScore,
            (p.lastScore === null || p.lastScore === undefined) ? "" : p.lastScore,
            p.createdAt || "", p.updatedAt || ""
          ]);
        });
        var csv = rows.map(function(row){ return row.map(csvField).join(","); }).join("\r\n");
        return window.claude.use("downloads").then(function(downloads){
          if(!downloads){ throw { code: "unavailable" }; }
          var stamp = new Date().toISOString().slice(0, 10);
          return downloads.save({ filename: "players-" + stamp + ".csv", data: csv });
        });
      })
      .then(function(){
        state.exportBusy = false; render();
      })
      .catch(function(err){
        state.exportBusy = false;
        var code = err && err.code;
        state.exportError = (code === "declined") ? "" : "Could not export the data — try again.";
        render();
      });
  }

  function editPlayerScore(id, rawValue){
    if(!db){ state.editScoreError = "Not connected — check your connection and try again."; render(); return; }
    var n = Number(rawValue);
    if(!Number.isFinite(n) || n < 0 || !Number.isInteger(n)){
      state.editScoreError = "Enter a whole number, 0 or higher.";
      render(); return;
    }
    state.busy = true; state.editScoreError = ""; render();
    db.doc("players/" + id).update({ bestScore: n, lastScore: n, updatedAt: new Date().toISOString() })
      .then(function(){
        state.busy = false; state.editingPlayer = null; render();
      })
      .catch(function(){
        state.busy = false; state.editScoreError = "Could not save — try again.";
        render();
      });
  }

  function removePlayerScore(id){
    if(!db){ state.editScoreError = "Not connected — check your connection and try again."; render(); return; }
    state.busy = true; state.editScoreError = ""; render();
    db.doc("players/" + id).update({ bestScore: null, lastScore: null, updatedAt: new Date().toISOString() })
      .then(function(){
        state.busy = false; state.editingPlayer = null; state.confirmRemove = false; render();
      })
      .catch(function(){
        state.busy = false; state.editScoreError = "Could not remove — try again.";
        render();
      });
  }

  function saveSettings(title, subtitle){
    if(!db){ state.showSettings = false; render(); return; }
    title = title.trim() || "Booth Challenge";
    subtitle = subtitle.trim() || "Play the game. Climb the board.";
    state.busy = true; render();
    db.doc("config/event").set({ title: title, subtitle: subtitle }).then(function(){
      state.showSettings = false; state.busy = false; render();
    }).catch(function(){
      state.busy = false; render();
    });
  }

  // ---------------- render: kiosk ----------------
  function stepIndex(step){
    if(step === "start") return 0;
    if(step === "new" || step === "existing") return 1;
    if(step === "score") return 2;
    return 3;
  }
  function stepsHTML(){
    var labels = ["Identify", "Score", "Done"];
    var idx = stepIndex(state.step);
    return '<div class="steps">' + labels.map(function(lbl, i){
      var cls = i < idx ? "step done" : (i === idx ? "step active" : "step");
      return '<div class="' + cls + '"><div class="bar"></div><div class="label">' + lbl + '</div></div>';
    }).join("") + '</div>';
  }

  app.addEventListener("click", function(e){
    var backdrop = e.target.closest && e.target.closest("[data-action='close-settings-backdrop'], [data-action='close-edit-backdrop']");
    if(backdrop && e.target === backdrop){ state.showSettings = false; state.editingPlayer = null; state.confirmRemove = false; render(); return; }
    var el = e.target.closest && e.target.closest("[data-action]");
    if(!el) return;
    var action = el.dataset.action;
    if(action === "close-settings-backdrop" || action === "close-edit-backdrop") return;
    switch(action){
      case "choose-mode": setMode(el.dataset.mode); break;
      case "switch-mode": setMode(null); break;
      case "open-settings": state.showSettings = true; state.exportError = ""; render(); break;
      case "close-settings": state.showSettings = false; render(); break;
      case "go-start": goStep("start"); break;
      case "go-new": goStep("new"); break;
      case "go-existing": goStep("existing"); break;
      case "select-player": {
        var id = el.dataset.id;
        var p = state.players.filter(function(x){ return x.id === id; })[0];
        if(p){ teardownExisting(); state.selectedPlayer = p; state.step = "score"; render(); }
        break;
      }
      case "use-dup":
        state.selectedPlayer = state.dupPlayer; state.step = "score"; state.formError = ""; render();
        break;
      case "play-again":
        state.step = "score"; state.scoreError = ""; render();
        break;
      case "next-player": goStep("start"); break;
      case "export-csv": exportPlayersCsv(); break;
      case "open-edit": {
        var rowId = el.dataset.id;
        var row = state.players.filter(function(x){ return x.id === rowId; })[0];
        if(row){ state.editingPlayer = row; state.editScoreError = ""; state.confirmRemove = false; render(); }
        break;
      }
      case "close-edit": state.editingPlayer = null; state.confirmRemove = false; render(); break;
      case "ask-remove": state.confirmRemove = true; render(); break;
      case "cancel-remove": state.confirmRemove = false; render(); break;
      case "confirm-remove": removePlayerScore(state.editingPlayer.id); break;
      case "toggle-fullscreen": toggleFullscreen(); break;
    }
  });

  app.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var tile = e.target.closest && e.target.closest(".mode-tile[data-action]");
    if(tile){ e.preventDefault(); setMode(tile.dataset.mode); }
  });

  app.addEventListener("submit", function(e){
    e.preventDefault();
    if(e.target.id === "new-player-form"){
      var fd = new FormData(e.target);
      createPlayer(String(fd.get("name") || ""), String(fd.get("company") || ""), String(fd.get("email") || ""));
    } else if(e.target.id === "score-form"){
      var fd2 = new FormData(e.target);
      submitScore(fd2.get("score"));
    } else if(e.target.id === "settings-form"){
      var fd3 = new FormData(e.target);
      saveSettings(String(fd3.get("title") || ""), String(fd3.get("subtitle") || ""));
    } else if(e.target.id === "edit-score-form"){
      var fd4 = new FormData(e.target);
      editPlayerScore(state.editingPlayer.id, fd4.get("score"));
    }
  });

  app.addEventListener("input", function(e){
    if(e.target.id === "existing-search"){
      state.searchTerm = e.target.value;
      renderExistingListOnly();
    }
  });

  // ---------------- boot ----------------
  function init(){
    var params = new URLSearchParams(location.search);
    var urlMode = params.get("mode");
    if(urlMode === "kiosk" || urlMode === "leaderboard"){
      state.mode = urlMode;
      saveModePref(urlMode);
    } else {
      var saved = loadModePref();
      if(saved === "kiosk" || saved === "leaderboard") state.mode = saved;
    }
    render();

    var boot = function(){
      if(!(window.claude && window.claude.use)){ state.dbAvailable = false; render(); return; }
      window.claude.use("db").then(function(d){
        db = d;
        state.dbAvailable = !!d;
        if(db){
          subscribeConfig();
          if(state.mode === "leaderboard") subscribeLeaderboard();
          if(state.mode === "kiosk" && state.step === "existing") subscribeExisting();
        }
        render();
      });
    };
    boot();
  }

  init();
})();
</script>
